# Builds Wander for macOS (Apple Silicon + Intel) and Windows, checks it with pluginval, and on a
# version tag (v0.1.0, ...) publishes the zips as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            configure: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            targets: Wander_VST3 Wander_AU Wander_Standalone
          - name: Windows
            os: windows-latest
            configure: ""
            targets: Wander_VST3 Wander_Standalone
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWANDER_COPY_PLUGIN=OFF ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target ${{ matrix.targets }}

      - name: Sign ad hoc (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/Wander_artefacts/Release
          codesign --force --deep --sign - VST3/Wander.vst3 AU/Wander.component Standalone/Wander.app

      - name: Validate with pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --skip-gui-tests --validate-in-process \
            --validate build/Wander_artefacts/Release/VST3/Wander.vst3

      - name: Validate with pluginval (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # pluginval prints SUCCESS or FAILED; on Windows its exit code is not reliable after the tests pass
          $log = & .\pluginval\pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process --validate build\Wander_artefacts\Release\VST3\Wander.vst3 2>&1 | Out-String
          Write-Output $log
          if ($log -match 'FAILED' -or -not ($log -match 'SUCCESS')) { exit 1 }
          exit 0

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/Wander
          cp -R build/Wander_artefacts/Release/VST3/Wander.vst3 build/Wander_artefacts/Release/AU/Wander.component \
                build/Wander_artefacts/Release/Standalone/Wander.app dist/Wander/
          cp docs/INSTALL-macOS.txt dist/Wander/INSTALL.txt
          cd dist && ditto -c -k --keepParent Wander Wander-macOS.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Wander | Out-Null
          Copy-Item -Recurse build\Wander_artefacts\Release\VST3\Wander.vst3 dist\Wander\
          Copy-Item build\Wander_artefacts\Release\Standalone\Wander.exe dist\Wander\
          Copy-Item docs\INSTALL-Windows.txt dist\Wander\INSTALL.txt
          Compress-Archive -Path dist\Wander -DestinationPath dist\Wander-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Wander-${{ matrix.name }}
          path: dist/Wander-*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: REAPER version (JSFX)
        run: cd jsfx && zip -q ../dist/Wander-REAPER-JSFX.zip wander-synth.jsfx wander-synth.presets.ini
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "Wander ${GITHUB_REF_NAME}" --notes-file docs/RELEASE.md
